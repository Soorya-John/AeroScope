[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroscope-backend"
version = "0.1.0"
description = "Local-first drone telemetry and flight-log analysis service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mavlink = ["pymavlink>=2.4.41,<3"]
ulog = ["pyulog>=1.1.0,<2"]
web = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3", "sqlalchemy>=2.0,<3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
